function duration(t){if(!t.start||!t.end)return '';let [a,b]=[t.start,t.end].map(x=>{let [h,m]=x.split(':').map(Number);return h*60+m});return `${Math.max(0,b-a)} min`}
function tasksFor(date){if(data.overrides[date])return data.overrides[date].tasks;let dow=dayName(date);let source=(dow==='Saturday'||dow==='Sunday')?(data.templates['Weekend plan']||[]):data.routine;return source.map(t=>({...t,id:uid(),status:'pending',title:t.title.replace('{workout}',data.workouts[dow]||'Workout')}))}

function persistTasks(date,tasks){data.overrides[date]={...(data.overrides[date]||{}),tasks};save()}
function tasksSorted(tasks){return [...tasks].sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function dateIsWeekend(date){return [0,6].includes(new Date(date+'T12:00:00').getDay())}
function todayStatus(t,date){if(t.status==='done'||t.status==='skipped'||t.status==='unfinished')return t.status;let now=new Date(),n=iso(now);if(date<n)return 'overdue';if(date>n)return 'upcoming';let nowmin=now.getHours()*60+now.getMinutes(),end=(t.end||t.start||'00:00').split(':').reduce((h,m)=>h*60+ +m,0),start=(t.start||'00:00').split(':').reduce((h,m)=>h*60+ +m,0);if(end<nowmin)return 'overdue';if(start<=nowmin&&end>=nowmin)return 'current';return 'upcoming'}

<div class="hero-actions"><button class="btn btn-primary" data-action="addTask" data-date="${date}">＋ Add a task</button><button class="btn btn-plain" data-action="runningLate" data-date="${date}">↗ I’m running late</button><button class="btn btn-soft" data-action="changeDay" data-date="${date}">Change day</button></div>

function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells=Array.from({length:first},()=>'<button class="calendar-day dim" disabled></button>');for(let n=1;n<=days;n++){let d=iso(new Date(y,m,n)),event=data.events[d]||data.overrides[d]?.event;cells.push(`<button class="calendar-day ${d===today?'today':''} ${d===selected?'selected':''} ${dateIsWeekend(d)?'weekend':''} ${event?'has-event':''}" data-action="selectDate" data-date="${d}" aria-label="${pretty(d)}${event?', '+event.type:''}">${n}</button>`)}while(cells.length%7)cells.push('<button class="calendar-day dim" disabled></button>');let ev=data.events[selected]||data.overrides[selected]?.event;let eventText=ev?`<span class="event-chip">${esc(ev.type)}${ev.label?': '+esc(ev.label):''}</span>`:dateIsWeekend(selected)?'<span class="event-chip">College off · weekend</span>':'<span class="hint">No special day set</span>';

function renderRoutines(){app.innerHTML=`<div class="main-grid"><section class="content"><div class="hero-row"><div><div class="eyebrow">THE BUILDING BLOCKS</div><h1 class="page-title">Routines</h1><p class="subtitle">Set a rhythm that works for the real version of your day.</p></div><button class="btn btn-primary" data-action="addRoutineTask">＋ Add routine task</button></div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Weekday routine</h2><button class="btn btn-plain btn-small" data-action="resetRoutine">Reset defaults</button></div><p class="hint">Edit your standard Monday–Friday schedule. Dates with their own plan stay unchanged.</p><div class="routine-list">${tasksSorted(data.routine).map(t=>`<div class="routine-item"><div class="routine-time">${esc(t.start)}${t.end?' – '+esc(t.end):''}</div><div class="push"><strong>${esc(t.title.replace('{workout}','Workout'))}</strong><small>${esc(t.note||duration(t))}</small></div><button class="btn btn-plain btn-small" data-action="editRoutineTask" data-id="${t.id}">Edit</button><button class="btn btn-danger btn-small" data-action="deleteRoutineTask" data-id="${t.id}">×</button></div>`).join('')}</div><div class="reminder-note" style="margin-top:15px">Timing note: “Get ready & travel” ends at 5:20 AM and the gym starts at 5:20 AM. Adjust the travel task separately when needed.</div></div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Weekly workout plan</h2><button class="btn btn-plain btn-small" data-action="editWorkout">Edit schedule</button></div>${Object.entries(data.workouts).map(([d,w])=>`<div class="mini-stat"><strong>${d}</strong><span>${esc(w)}</span></div>`).join('')}</div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Schedule templates</h2><button class="btn btn-plain btn-small" data-action="newTemplate">＋ New template</button></div><div class="template-grid">${Object.entries(data.templates).map(([name,list])=>`<div class="template-card"><strong>${esc(name)}</strong><p>${list.length} tasks · reusable on any date</p><button class="btn btn-plain btn-small" data-action="editTemplate" data-name="${esc(name)}">Edit</button></div>`).join('')}</div></div></section><aside class="side-stack"><div class="side-card"><h3>Routine settings</h3><div class="settings-row"><div><strong>Buffer between tasks</strong><small>Extra breathing room in your schedule.</small></div><select id="bufferSelect" style="max-width:90px;border:1px solid var(--line);padding:7px;border-radius:8px"><option ${data.settings.buffer===0?'selected':''}>0</option><option ${data.settings.buffer===5?'selected':''}>5</option><option ${data.settings.buffer===10?'selected':''}>10</option><option ${data.settings.buffer===15?'selected':''}>15</option></select></div><div class="hint">A buffer is a planning cue; it won’t automatically shift the next task.</div></div><div class="side-card"><h3>Consistency, without pressure</h3><p class="hint">See your week as a whole. A missed task is information, not a failure.</p><button class="btn btn-soft btn-small" data-action="weeklyReview">Open weekly review →</button></div></aside></div>`;wireActions();$('#bufferSelect').onchange=e=>{data.settings.buffer=+e.target.value;save();render()}}

app.innerHTML=`<div class="main-grid"><section class="content"><div class="hero-row"><div><div class="eyebrow">A LITTLE LESS TO REMEMBER</div><h1 class="page-title">Laundry</h1><p class="subtitle">Track the bags, plan the drop-offs, keep your head clear.</p></div><button class="btn btn-primary" data-action="dropLaundry">＋ Log drop-off</button></div><div class="panel"><div class="laundry-kpis"><div class="kpi"><span>Used</span><strong>${used}</strong></div><div class="kpi"><span>Remaining</span><strong>${left}</strong></div><div class="kpi"><span>Waiting pickup</span><strong>${pending.length}</strong></div></div><div class="progress-bar"><span style="width:${Math.min(100,used/L.total*100)}%"></span></div><div class="hint">${used} of ${L.total} bags used · ${left} bags left in your plan</div></div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Drop-off & pickup reminders</h2><button class="btn btn-plain btn-small" data-action="laundryReminder">${L.reminderDate?'Change reminder':'Set a reminder'}</button></div>${L.reminderDate?`<div class="mini-stat"><strong>Next drop-off</strong><span>${pretty(L.reminderDate)}</span><button class="task-menu" data-action="clearLaundryReminder">×</button></div>`:'<div class="empty-state"><b>No drop-off planned</b>Choose the date you’d like a reminder.</div>'}${pending.length?`<div class="reminder-note" style="margin-top:12px">${pending.length} pickup${pending.length>1?'s':''} waiting. Pickup is scheduled for two days after each drop-off.</div>`:''}</div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Bag history</h2><small>${L.records.length} drop-off${L.records.length===1?'':'s'}</small></div>${L.records.length?`<div class="records-list">${[...L.records].reverse().map(rec=>`<div class="record-item"><div class="laundry-icon">◌</div><div class="push"><strong>${rec.bags} bag${rec.bags===1?'':'s'} dropped off</strong><small>${pretty(rec.date)} · Pickup ${pretty(rec.pickup)}${rec.picked?' · Picke function taskForm(task={}){return `<div class="form-grid"><div class="field full"><label>Task name</label><input name="title" required maxlength="80" value="${esc(task.title||'')}"></div><div class="field"><label>Start time</label><input name="start" type="time" value="${task.start||'09:00'}" required></div><div class="field"><label>End time</label><input name="end" type="time" value="${task.end||'09:30'}"></div><div class="field full"><label>Notes (optional)</label><textarea name="note" maxlength="240">${esc(task.note||'')}</textarea></div><div class="field"><label><input type="checkbox" name="remindStart" ${task.remindStart?'checked':''}> Remind at start</label></div><div class="field"><label><input type="checkbox" name="remindEnd" ${task.remindEnd!==false?'checked':''}> Ask at end</label></div></div>`}
function getTaskForm(f,existing={}){let fd=new FormData(f);let title=(fd.get('title')||'').trim(),start=fd.get('start'),end=fd.get('end');if(end&&start>=end){toast('End time needs to be after start time.');return null}return {...existing,title,start,end,note:(fd.get('note')||'').trim(),remindStart:fd.has('remindStart'),remindEnd:fd.has('remindEnd'),status:existing.status||'pending',id:existing.id||uid()}}
function openTask(date,task=null,base='date'){modal(task?'Edit task':'Add a task',taskForm(task||{}),f=>{let t=getTaskForm(f,task||{});if(!t)return false;let list=base==='routine'?data.routine:base.startsWith('template:')?data.templates[base.slice(9)]:ensureDate(date).tasks;let others=task?list.filter(x=>x.id!==task.id):list;if(t.start&&t.end&&others.some(x=>x.start&&x.end&&t.start<x.end&&t.end>x.start)&&!confirm("This time overlaps another task. Save it anyway?"))return false;if(task)list.splice(list.findIndex(x=>x.id===task.id),1,t);else list.push(t);if(base==='routine'){data.routine=list;save();renderRoutines()}else if(base.startsWith('template:')){data.templates[base.slice(9)]=list;save();renderRoutines()}else{persistTasks(date,list);render()}toast(task?'Task updated':'Task added')})}
function getTask(date,id){return tasksFor(date).find(x=>x.id===id)}
function editDay(date){ensureDate(date);modal('Change this day',`<p class="hint">Choose a reusable schedule, or keep the current plan and edit it. Changes apply to ${pretty(date)} only.</p><div class="field"><label>Apply a saved template</label><select name="template"><option value="">Keep current tasks</option>${Object.keys(data.templates).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Special day type</label><select name="type"><option value="">Regular day</option>${['Holiday','Vacation','College event','Project day','Custom day'].map(x=>`<option ${data.events[date]?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Label (optional)</label><input name="label" value="${esc(data.events[date]?.label||'')}"></div>`,f=>{let fd=new FormData(f),tpl=fd.get('template'),type=fd.get('type'),label=fd.get('label');if(tpl)data.overrides[date]={tasks:data.templates[tpl].map(x=>({...x,id:uid(),status:'pending'})),event:null};data.events[date]=type?{type,label}:null;save();if(view==='today')renderToday();else renderCalendar();toast(tpl?'Template applied to this date':'Day updated')})}
function eventDialog(date){modal('Set a day type',`<div class="form-grid"><div class="field"><label>Day type</label><select name="type" required>${['Holiday','Vacation','College event','Project day','Custom day'].map(x=>`<option ${data.events[date]?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Label</label><input name="label" maxlength="60" value="${esc(data.events[date]?.label||'')}"></div></div><p class="hint">This is your personal calendar entry. No official holidays are added automatically.</p>`,f=>{let fd=new FormData(f);data.events[date]={type:fd.get('type'),label:fd.get('label')};save();renderCalendar();toast('Day type saved')})}
function wireActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset))}
function action(a,d){let date=d.date||selected;
if(a==='prevDate'){selected=plus(selected,-1);render()}if(a==='nextDate'){selected=plus(selected,1);render()}if(a==='selectDate'){selected=date;renderCalendar()}if(a==='calPrev'){calDate.setMonth(calDate.getMonth()-1);renderCalendar()}if(a==='calNext'){calDate.setMonth(calDate.getMonth()+1);renderCalendar()}if(a==='viewDate'){selected=date;setView('today')}
if(a==='addTask')openTask(date);if(a==='addRoutineTask')openTask(null,null,'routine');if(a==='editRoutineTask'){let t=data.routine.find(x=>x.id===d.id);openTask(null,t,'routine')}if(a==='deleteRoutineTask'){if(confirm('Remove this task from your standard weekday routine?')){data.routine=data.routine.filter(x=>x.id!==d.id);save();renderRoutines()}}if(a==='resetRoutine'){if(confirm('Restore the original weekday routine?')){data.routine=seedTasks.map(x=>({...x}));save();renderRoutines()}}
if(a==='toggle'){let list=ensureDate(date).tasks,t=list.find(x=>x.id===d.id);if(t){t.status=t.status==='done'?'pending':'done';persistTasks(date,list);render();}}
if(a==='taskMenu'){let t=getTask(date,d.id);if(t)modal(t.title,`<div class="hint">${esc(t.start)}–${esc(t.end||'')} · ${esc(t.status||'pending')}</div><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:14px"><button class="btn btn-soft btn-small" type="button" data-task-edit="1">Edit</button><button class="btn btn-plain btn-small" type="button" data-task-reschedule="1">Reschedule</button><button class="btn btn-plain btn-small" type="button" data-task-unfinished="1">Mark unfinished</button><button class="btn btn-plain btn-small" type="button" data-task-skip="1">Skip</button><button class="btn btn-danger btn-small" type="button" data-task-delete="1">Delete</button></div>`,()=>false);let root=$('#dialogRoot');root.querySelector('[data-task-edit]').onclick=()=>{root.innerHTML='';openTask(date,t)};root.querySelector('[data-task-reschedule]').onclick=()=>{root.innerHTML='';rescheduleTask(date,t)};root.querySelector('[data-task-unfinished]').onclick=()=>setStatus(date,t,'unfinished');root.querySelector('[data-task-skip]').onclick=()=>setStatus(date,t,'skipped');root.querySelector('[data-task-delete]').onclick=()=>{if(confirm('Delete this task?')){persistTasks(date,ensureDate(date).tasks.filter(x=>x.id!==t.id));root.innerHTML='';render()}}}
if(a==='runningLate'){let pending=tasksSorted(ensureDate(date).tasks).filter(t=>!['done','skipped'].includes(t.status));if(!pending.length){toast('Nothing left to move.');return}modal('Running late',`<p class="hint">Move unfinished tasks forward by how much? This changes ${pretty(date)} only.</p><div class="field"><label>Move by</label><select name="mins"><option value="10">10 minutes</option><option value="15" selected>15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option></select></div><p class="hint">Completed tasks will stay where they are.</p>`,f=>{let mins=+new FormData(f).get('mins');for(let t of pending){if(t.start)t.start=shiftTime(t.start,mins);if(t.end)t.end=shiftTime(t.end,mins)}persistTasks(date,ensureDate(date).tasks);render();toast('Your remaining plan moved forward')})}
if(a==='changeDay')editDay(date);if(a==='markHoliday'){data.events[date]={type:'Holiday',label:''};save();render();toast('Marked as a personal holiday')}if(a==='tomorrow'){selected=plus(today,1);setView('today')}if(a==='gotoLaundry')setView('laundry');if(a==='goToday'){selected=today;setView('today')}
if(a==='editWorkout')workoutDialog();if(a==='summary')summaryDialog(date);if(a==='weeklyReview')weeklyReview();if(a==='dayTemplate')editDay(date);if(a==='setEvent')eventDialog(date);if(a==='removeEvent'){delete data.events[date];if(data.overrides[date])data.overrides[date].event=null;save();renderCalendar()}if(a==='holidayList')eventListDialog();if(a==='manageTemplates')setView('routines');if(a==='newTemplate')newTemplateDialog();if(a==='editTemplate')editTemplate(d.name);
if(a==='dropLaundry')dropDialog();if(a==='pickup'){let r=data.laundry.records.find(x=>x.id===d.id);if(r){r.picked=true;save();renderLaundry();toast('Pickup marked complete')}}if(a==='editDrop')editDrop(d.id);if(a==='laundryReminder')laundryReminder();if(a==='clearLaundryReminder'){data.laundry.reminderDate='';save();renderLaundry()}if(a==='laundrySettings')setView('settings');if(a==='saveLaundrySettings')saveLaundrySettings();if(a==='exportData')exportData();if(a==='importData')$('#importFile')?.click();if(a==='clearData')clearData();if(a==='installHelp')installHelp()}
function shiftTime(t,mins){let [h,m]=t.split(':').map(Number),n=Math.min(23*60+59,Math.max(0,h*60+m+mins));return `${pad(Math.floor(n/60))}:${pad(n%60)}`}
function setStatus(date,t,status){let list=ensureDate(date).tasks,found=list.find(x=>x.id===t.id);if(found)found.status=status;persistTasks(date,list);$('#dialogRoot').innerHTML='';render();toast(status==='done'?'Task complete':status==='skipped'?'Task skipped':'Marked unfinished')}
function rescheduleTask(date,t){modal('Reschedule task',`<p class="hint">Choose a new date and time. Your existing plan stays unchanged until you save.</p><div class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${date}" required></div><div class="field"><label>Start time</label><input name="start" type="time" value="${t.start||'09:00'}" required></div><div class="field"><label>End time</label><input name="end" type="time" value="${t.end||'09:30'}"></div></div>`,f=>{let fd=new FormData(f),target=fd.get('date');if(fd.get('end')&&fd.get('start')>=fd.get('end')){toast('End time needs to be after start time.');return false}let old=ensureDate(date).tasks;old=old.filter(x=>x.id!==t.id);persistTasks(date,old);let targetTasks=ensureDate(target).tasks;targetTasks.push({...t,start:fd.get('start'),end:fd.get('end'),status:'pending',id:uid()});persistTasks(target,targetTasks);selected=target;render();toast('Task rescheduled')})}
function workoutDialog(){modal('Weekly workout plan',`<div class="form-grid">${Object.keys(workouts).map(day=>`<div class="field"><label>${day}</label><input name="${day}" value="${esc(data.workouts[day])}" maxlength="30"></div>`).join('')}</div>`,f=>{let fd=new FormData(f);for(let day of Object.keys(workouts))data.workouts[day]=(fd.get(day)||'').trim()||'Rest';save();render();toast('Workout plan saved')})}
function summaryDialog(date){let ts=tasksFor(date),counts={done:ts.filter(t=>t.status==='done').length,skipped:ts.filter(t=>t.status==='skipped').length,unfinished:ts.filter(t=>t.status==='unfinished'||todayStatus(t,date)==='overdue').length},key=date;modal('Day review',`<p class="hint">A quick look at ${pretty(date)}. Carry anything forward only if you choose to.</p><div class="laundry-kpis"><div class="kpi"><span>Completed</span><strong>${counts.done}</strong></div><div class="kpi"><span>Skipped</span><strong>${counts.skipped}</strong></div><div class="kpi"><span>Unfinished</span><strong>${counts.unfinished}</strong></div></div><div class="field" style="margin-top:13px"><label>One note for the day (optional)</label><textarea name="note" placeholder="What worked? What would help tomorrow?">${esc(data.review[key]||'')}</textarea></div><p class="hint">Tomorrow’s plan is ready when you are.</p>`,f=>{data.review[key]=new FormData(f).get('note')||'';save();toast('Day review saved')},{saveText:'Save review'})}
function weeklyReview(){let d=new Date();let monday=new Date(d);monday.setDate(d.getDate()-(d.getDay()+6)%7);let sums={done:0,skipped:0,unfinished:0};for(let i=0;i<7;i++){let date=iso(new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i)),ts=data.overrides[date]?.tasks||[];sums.done+=ts.filter(t=>t.status==='done').length;sums.skipped+=ts.filter(t=>t.status==='skipped').length;sums.unfinished+=ts.filter(t=>t.status==='unfinished').length}modal('Your week, at a glance',`<p class="hint">A kind check-in on what happened this week. No streaks to break, just useful information.</p><div class="laundry-kpis"><div class="kpi"><span>Completed</span><strong>${sums.done}</strong></div><div class="kpi"><span>Skipped</span><strong>${sums.skipped}</strong></div><div class="kpi"><span>Unfinished</span><strong>${sums.unfinished}</strong></div></div><p class="hint" style="margin-top:13px">Tasks without a status are still simply on your plan.</p>`,()=>true,{saveText:'Done'})}
function newTemplateDialog(){modal('New schedule template',`<div class="field"><label>Template name</label><input name="name" required maxlength="35" placeholder="e.g. Exam day"></div><p class="hint">You can add tasks to it after creating.</p>`,f=>{let name=new FormData(f).get('name').trim();if(data.templates[name]){toast('A template with that name already exists.');return false}data.templates[name]=[];save();renderRoutines();toast('Template created')})}
function editTemplate(name){let list=data.templates[name];modal(`Edit · ${name}`,`<p class="hint">Template tasks are copied onto a date when applied. Later changes to a date remain independent.</p><div class="routine-list">${list.map(t=>`<div class="routine-item"><div class="routine-time">${esc(t.start)}–${esc(t.end||'')}</div><div class="push"><strong>${esc(t.title)}</strong></div><button class="btn btn-plain btn-small" type="button" data-te="${t.id}">Edit</button><button class="btn btn-danger btn-small" type="button" data-td="${t.id}">×</button></div>`).join('')||'<div class="empty-state">No tasks yet. Add a first task below.</div>'}</div><button class="btn btn-soft btn-small" type="button" id="addTplTask" style="margin-top:12px">＋ Add task</button>${Object.keys(data.templates).length>1?`<button class="btn btn-danger btn-small" type="button" id="deleteTemplate" style="margin-left:6px">Delete template</button>`:''}`,()=>false,{saveText:'Done'});let root=$('#dialogRoot');root.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>{let t=data.templates[name].find(x=>x.id===b.dataset.te);root.innerHTML='';openTask(null,t,'template:'+name)});root.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>{data.templates[name]=data.templates[name].filter(x=>x.id!==b.dataset.td);save();root.innerHTML='';editTemplate(name)});root.querySelector('#addTplTask').onclick=()=>{root.innerHTML='';openTask(null,null,'template:'+name)};root.querySelector('#deleteTemplate')?.addEventListener('click',()=>{if(confirm(`Delete the ${name} template?`)){delete data.templates[name];save();root.innerHTML='';renderRoutines()}})}
function eventListDialog(){let events=Object.entries(data.events).filter(([,x])=>x);modal('Your holiday & event list',`<p class="hint">Personal entries only. Choose any date in the calendar to add holidays or vacations.</p>${events.length?events.map(([date,e])=>`<div class="mini-stat"><strong>${pretty(date)} · ${esc(e.type)}${e.label?' — '+esc(e.label):''}</strong><button class="btn btn-danger btn-small" type="button" data-evdel="${date}">Remove</button></div>`).join(''):'<div class="empty-state">No custom days added yet.</div>'}`,()=>false,{saveText:'Done'});$('#dialogRoot').querySelectorAll('[data-evdel]').forEach(b=>b.onclick=()=>{delete data.events[b.dataset.evdel];save();eventListDialog();renderCalendar()})}
function dropDialog(record=null){modal(record?'Edit drop-off':'Log a laundry drop-off',`<div class="form-grid"><div class="field"><label>Drop-off date</label><input name="date" type="date" value="${record?.date||today}" required></div><div class="field"><label>Number of bags</label><input name="bags" type="number" min="1" max="60" value="${record?.bags||1}" required></div><div class="field"><label>Pickup date</label><input name="pickup" type="date" value="${record?.pickup||plus(today,2)}" required></div></div><p class="hint">Pickup is set to two days after drop-off by default. You can change it or cancel it later.</p>`,f=>{let fd=new FormData(f),date=fd.get('date'),pickup=fd.get('pickup'),bags=+fd.get('bags');if(pickup<date||bags<1){toast('Check the bag count and pickup date.');return false}if(record){Object.assign(record,{date,pickup,bags});}else data.laundry.records.push({id:uid(),date,pickup,bags,picked:false,pickupCancelled:false});save();renderLaundry();toast(record?'Drop-off updated':'Drop-off logged')})}
function editDrop(id){let r=data.laundry.records.find(x=>x.id===id);if(!r)return;modal('Drop-off options',`<div class="hint">${r.bags} bag${r.bags===1?'':'s'} · ${pretty(r.date)} · Pickup ${pretty(r.pickup)}</div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn btn-soft btn-small" type="button" id="editRecord">Edit details</button><button class="btn btn-plain btn-small" type="button" id="cancelPickup">${r.pickupCancelled?'Restore pickup reminder':'Cancel pickup reminder'}</button><button class="btn btn-danger btn-small" type="button" id="deleteRecord">Delete drop-off</button></div>`,()=>false,{saveText:'Done'});let root=$('#dialogRoot');root.querySelector('#editRecord').onclick=()=>{root.innerHTML='';dropDialog(r)};root.querySelector('#cancelPickup').onclick=()=>{if(r.pickupCancelled){r.pickupCancelled=false}else{r.pickupCancelled=true}save();root.innerHTML='';renderLaundry();toast('Pickup reminder updated')};root.querySelector('#deleteRecord').onclick=()=>{if(confirm('Delete this drop-off record?')){data.laundry.records=data.laundry.records.filter(x=>x.id!==id);save();root.innerHTML='';renderLaundry()}}}
function laundryReminder(){modal('Plan a drop-off',`<div class="field"><label>Reminder date</label><input name="date" type="date" min="${today}" value="${data.laundry.reminderDate||today}" required></div><p class="hint">The reminder is stored on this device. Browser notifications need permission and may not run while the app is closed.</p>`,f=>{data.laundry.reminderDate=new FormData(f).get('date');save();renderLaundry();toast('Drop-off reminder saved')})}
function saveLaundrySettings(){let total=+$('#bagTotal').value,months=[...$('#monthsGrid').querySelectorAll('input:checked')].map(x=>+x.value);if(total<0||!months.length){toast('Choose at least one active month and a valid bag total.');return}Object.assign(data.laundry,{total,activeMonths:months,summerStart:$('#summerStart').value,summerEnd:$('#summerEnd').value,reminderDate:$('#bagReminder').value});save();toast('Laundry plan saved');renderSettings()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forge-backup-${today}.json`;a.click();URL.revokeObjectURL(url);toast('Backup downloaded')}
function clearData(){if(confirm('Clear all Forge data from this device? This cannot be undone. Export a backup first if you may need it.')){localStorage.removeItem(STORE);data=initial();selected=today;save();render();toast('Your data has been cleared')}}
function installHelp(){modal('Install Forge on Android',`<ol class="hint" style="line-height:1.9"><li>Open the published Forge address in Chrome on your Android phone.</li><li>Tap Chrome’s three-dot menu, then “Install app” or “Add to Home screen”.</li><li>Confirm. Forge opens from your home screen and keeps its data on the device.</li></ol><p class="hint">Install requires the site to be served over HTTPS (localhost is also allowed for development). For an APK, see README.md for Capacitor steps.</p>`,()=>true,{saveText:'Got it'})}
$('#importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed||!parsed.routine||!parsed.laundry||!parsed.templates)throw Error('Invalid backup');if(confirm('Import this backup and replace the data on this device?')){data=parsed;save();render();toast('Backup imported')}}catch{toast('That file is not a valid Forge backup.')}e.target.value=''})
function toast(message){let el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function reminder(message){if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Forge',{body:message,icon:'icon.svg',tag:'daywell'})}catch{}}
}
let endAsked=new Set(),startNotified=new Set(),laundryReminderNotified='';function clockCheck(){if(view!=='today'||activePrompt)return;let date=today,now=new Date(),min=now.getHours()*60+now.getMinutes(),ts=tasksFor(date);if(data.laundry.reminderDate===date&&laundryReminderNotified!==date){laundryReminderNotified=date;reminder('Laundry drop-off is planned for today.');toast('Laundry drop-off reminder')}for(let t of ts){if(!t.start)continue;let sm=t.start.split(':').reduce((h,m)=>h*60+ +m,0),em=(t.end||t.start).split(':').reduce((h,m)=>h*60+ +m,0),key=date+t.id;if(t.remindStart&&sm===min&&!startNotified.has(key)){startNotified.add(key);reminder(`Time for ${t.title}.`)}if(t.remindEnd!==false&&em<=min&&t.status==='pending'&&!endAsked.has(key)){endAsked.add(key);activePrompt=key;modal(`How did “${t.title}” go?`,`<p class="hint">Its planned time has ended. Choose what feels right for your day.</p><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-soft btn-small" type="button" data-end="done">Completed</button><button class="btn btn-plain btn-small" type="button" data-end="reschedule">Reschedule</button><button class="btn btn-plain btn-small" type="button" data-end="unfinished">Unfinished</button><button class="btn btn-plain btn-small" type="button" data-end="skip">Skip</button><button class="btn btn-plain btn-small" type="button" data-end="snooze">Ask in 10 min</button></div>`,()=>{activePrompt=null;setTimeout(()=>{endAsked.delete(key);clockCheck()},10*60*1000);return true},{saveText:'Later'});$('#dialogRoot').querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{let choice=b.dataset.end;$('#dialogRoot').innerHTML='';if(choice==='snooze'){endAsked.delete(key);setTimeout(()=>clockCheck(),10*60*1000)}else if(choice==='reschedule')rescheduleTask(date,t);else setStatus(date,t,choice==='skip'?'skipped':choice);activePrompt=null;setTimeout(clockCheck,1000)})}return}}
window.addEventListener('focus',()=>{if(view==='today')renderToday();clockCheck()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null}else installHelp()};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
// Make date tasks stable before attaching actions; generated plans become independent only when the user edits them.
const originalRenderToday=renderToday;renderToday=function(){ensureDate(selected);originalRenderToday()};render();setInterval(clockCheck,30000);clockCheck();
})();

<script>
(()=>{const A=window.anime,app=document.getElementById('app'),q=(s,r=document)=>[...r.querySelectorAll(s)];
if(!A||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
let key='',prev=new Set(),prevPct=0;
function confetti(){const c=['#27684d','#d9824b','#bdd9c4','#4d7692','#f2c14e'];for(let i=0;i<40;i++){const s=document.createElement('i');s.className='confetti';s.style.cssText=`background:${c[i%5]};left:50%;top:38%`;document.body.appendChild(s);A({targets:s,translateX:A.random(-240,240),translateY:[0,A.random(-280,120)],rotate:A.random(-540,540),opacity:[1,0],duration:A.random(1000,1700),easing:'easeOutCubic',complete:()=>s.remove()})}}
function run(){const k=q('h1,.subtitle',app).map(e=>e.textContent).join('|'),fresh=k!==key;key=k;
const ring=app.querySelector('.progress-ring');
if(ring){const b=ring.querySelector('b'),pct=parseInt(b.textContent)||0,o={v:fresh?0:prevPct};if(!fresh&&pct===100&&prevPct<100)confetti();A({targets:o,v:pct,duration:fresh?1100:700,easing:'easeOutExpo',update:()=>{ring.style.setProperty('--progress',o.v*3.6+'deg');b.textContent=Math.round(o.v)+'%'}});prevPct=pct}
const chk=q('.check-btn.checked',app);if(!fresh)chk.filter(b=>!prev.has(b.dataset.id)).forEach(b=>A({targets:b,scale:[.4,1.25,1],duration:500,easing:'easeOutBack'}));prev=new Set(chk.map(b=>b.dataset.id));
if(!fresh)return;
const T=(t,p)=>A({targets:q(t,app),...p});
T('.eyebrow,.page-title,.subtitle',{translateY:[18,0],opacity:[0,1],delay:A.stagger(80),duration:800,easing:'easeOutExpo'});
T('.hero-actions .btn,.date-switch,.progress-card,.panel,.task-row',{translateY:[26,0],opacity:[0,1],delay:A.stagger(40,{start:180}),duration:700,easing:'easeOutCubic'});
T('.side-card,.workout',{translateX:[28,0],opacity:[0,1],delay:A.stagger(90,{start:300}),duration:750,easing:'easeOutCubic'});
T('.calendar-day',{scale:[.6,1],opacity:[0,1],delay:A.stagger(12),duration:500,easing:'easeOutBack'});
T('.streak-day',{scale:[.3,1],opacity:[0,1],delay:A.stagger(60,{start:500}),duration:500,easing:'easeOutBack'});
q('.progress-bar span',app).forEach(e=>{const w=e.style.width;A({targets:e,width:['0%',w],duration:1100,delay:400,easing:'easeOutExpo'})})}
new MutationObserver(run).observe(app,{childList:true});
const dr=document.getElementById('dialogRoot');
new MutationObserver(()=>{const m=dr.querySelector('.modal');if(!m)return;A({targets:dr.querySelector('.modal-backdrop'),opacity:[0,1],duration:250,easing:'linear'});A({targets:m,translateY:[34,0],scale:[.95,1],opacity:[0,1],duration:500,easing:'easeOutExpo'})}).observe(dr,{childList:true});
document.addEventListener('click',e=>{const n=e.target.closest('.nav-item');if(n)A({targets:n.querySelector('.nav-icon'),translateY:[0,-7,0],scale:[1,1.3,1],duration:500,easing:'easeOutQuad'});const b=e.target.closest('.btn');if(b)A({targets:b,scale:[.94,1],duration:450,easing:'easeOutElastic(1,.6)',complete:()=>b.style.transform=''})});
A({targets:'.brand-mark',rotate:[-120,0],scale:[.3,1],duration:1100,easing:'easeOutElastic(1,.7)'});
A({targets:'.brand-mark svg',scale:[1,1.07,1],duration:2800,loop:true,easing:'easeInOutSine',delay:1500});
A({targets:'.bottom-nav',translateY:[80,0],duration:800,easing:'easeOutExpo',delay:300});
run()})();
</script>
</body>
</html>
